name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to keep feedback fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.19.0'
  # Docker-backed integration suites fail here instead of skipping (db/test/docker-pg.ts).
  REQUIRE_DOCKER: '1'

jobs:
  web:
    name: web (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  db:
    name: db (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: db/package-lock.json

      - run: npm ci

      - run: npm test

  market:
    name: market (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/market
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/market/package-lock.json

      - run: npm ci

      - run: npm test

  home:
    name: home (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/home/package-lock.json

      - run: npm ci

      - run: npm test

  resolver:
    name: resolver (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/resolver/package-lock.json

      # Resolver tests invoke `npm run apply:schema` inside db/, so the db
      # workspace needs its dependencies installed too.
      - name: Install db deps (needed by resolver integration harness)
        working-directory: db
        run: npm ci

      - name: Install resolver deps
        working-directory: services/resolver
        run: npm ci

      - name: Run resolver tests
        working-directory: services/resolver
        run: npm test

  screener-artifacts:
    name: screener-artifacts (integration tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/screener-artifacts/package-lock.json

      # The ETL integration test imports the shared db/test Docker harness and
      # invokes `npm run seed` inside db/, so db dependencies must be present.
      - name: Install db deps (needed by screener-artifacts integration harness)
        working-directory: db
        run: npm ci

      - name: Install screener-artifacts deps
        working-directory: services/screener-artifacts
        run: npm ci

      - name: Run screener-artifacts tests
        working-directory: services/screener-artifacts
        run: npm test

  dev-api:
    name: dev-api (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/dev-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/dev-api/package-lock.json
            services/fundamentals/package-lock.json
            services/financial-core/package-lock.json

      # Dev-api tests import the shared db/test Docker harness and invoke
      # `npm run apply:schema` inside db/, so db dependencies must be present.
      - name: Install db deps (needed by dev-api integration harness)
        working-directory: db
        run: npm ci

      # The dev runtime imports the SEC fetch boundary (lossless-json).
      - name: Install fundamentals deps (imported by the dev runtime)
        working-directory: services/fundamentals
        run: npm ci

      # The financial routes import financial-core sources, which resolve their
      # own dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by the financial routes)
        working-directory: services/financial-core
        run: npm ci

      - name: Install dev-api deps
        run: npm ci

      - name: Run dev-api tests
        run: npm test

  watchlists:
    name: watchlists (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/watchlists/package-lock.json

      # Watchlists tests invoke `npm run apply:schema` inside db/, so the db
      # workspace needs its dependencies installed too.
      - name: Install db deps (needed by watchlists integration harness)
        working-directory: db
        run: npm ci

      - name: Install watchlists deps
        working-directory: services/watchlists
        run: npm ci

      - name: Run watchlists tests
        working-directory: services/watchlists
        run: npm test

  tools:
    name: tools (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm test

  llm:
    name: llm (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/llm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/llm/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  snapshot:
    name: snapshot (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The financial verifier recomputes through financial-core, which resolves
      # its own dependencies (ajv, decimal.js) from its node_modules; the
      # verifier's database test uses the shared db/test Docker harness.
      - name: Install db deps (needed by the financial verifier database test)
        working-directory: db
        run: npm ci

      - name: Install financial-core deps (imported by the financial verifier)
        working-directory: services/financial-core
        run: npm ci

      - run: npm ci

      - run: npm test

  observability:
    name: observability (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/observability/package-lock.json

      # Observability tests use the shared db/test Docker harness and invoke
      # `npm run apply:schema` inside db/, so db dependencies must be present.
      - name: Install db deps (needed by observability integration harness)
        working-directory: db
        run: npm ci

      - name: Install observability deps
        working-directory: services/observability
        run: npm ci

      - name: Run observability tests
        working-directory: services/observability
        run: npm test

  evidence:
    name: evidence (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/evidence/package-lock.json

      # Evidence tests use the shared db/test Docker harness and invoke
      # `npm run apply:schema` inside db/, so db dependencies must be present.
      - name: Install db deps (needed by evidence integration harness)
        working-directory: db
        run: npm ci

      - name: Install evidence deps
        working-directory: services/evidence
        run: npm ci

      - name: Run evidence tests
        working-directory: services/evidence
        run: npm test

  agents:
    name: agents (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/agents/package-lock.json
            services/financial-core/package-lock.json

      - name: Install db deps (needed by agents integration harness)
        working-directory: db
        run: npm ci

      # Numerical thesis conditions import financial-core sources, which resolve
      # their own dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by verified thesis conditions)
        working-directory: services/financial-core
        run: npm ci

      - name: Install agents deps
        working-directory: services/agents
        run: npm ci

      - name: Run agents tests
        working-directory: services/agents
        run: npm test

  analyze:
    name: analyze (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/financial-core/package-lock.json

      # Analyze integration tests import the shared db/test Docker harness.
      - name: Install db deps (needed by analyze integration harness)
        working-directory: db
        run: npm ci

      # Numerical memo sections import financial-core sources, which resolve
      # their own dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by analyze financial sections)
        working-directory: services/financial-core
        run: npm ci

      - name: Run analyze tests
        working-directory: services/analyze
        run: npm test

  artifact:
    name: artifact (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm test

  notifications:
    name: notifications (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/notifications/package-lock.json

      - run: npm ci
      - run: npm test

  chat:
    name: chat (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/chat/package-lock.json
            services/financial-core/package-lock.json

      # Chat repository integration tests import the shared db/test Docker harness.
      - name: Install db deps (needed by chat integration harness)
        working-directory: db
        run: npm ci

      # The financial lane imports financial-core sources, which resolve their
      # own dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by the chat financial lane)
        working-directory: services/financial-core
        run: npm ci

      - name: Install chat deps
        working-directory: services/chat
        run: npm ci

      - name: Run chat tests
        working-directory: services/chat
        run: npm test

  fundamentals:
    name: fundamentals (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: db/package-lock.json

      # Fundamentals reader integration test imports the shared db/test Docker harness.
      - name: Install db deps (needed by fundamentals integration harness)
        working-directory: db
        run: npm ci

      # The SEC fetch boundary parses company facts with lossless-json.
      - name: Install fundamentals deps
        working-directory: services/fundamentals
        run: npm ci

      - name: Run fundamentals tests
        working-directory: services/fundamentals
        run: npm test

  portfolio:
    name: portfolio (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/portfolio/package-lock.json

      # Portfolio integration tests import the shared db/test Docker harness.
      - name: Install db deps (needed by portfolio integration harness)
        working-directory: db
        run: npm ci

      - name: Install portfolio deps
        working-directory: services/portfolio
        run: npm ci

      - name: Run portfolio tests
        working-directory: services/portfolio
        run: npm test

  screener:
    name: screener (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/screener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm test

  summary:
    name: summary (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/summary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm test

  themes:
    name: themes (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: db/package-lock.json

      # Themes integration tests import the shared db/test Docker harness.
      - name: Install db deps (needed by themes integration harness)
        working-directory: db
        run: npm ci

      - name: Run themes tests
        working-directory: services/themes
        run: npm test

  discovery:
    name: discovery (synthetic integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCOVERY_ENABLED: false
      DISCOVERY_SEARCH_API_KEY: synthetic-ci-key
      SEC_EDGAR_USER_AGENT: market-agent-ci contact@example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/discovery/package-lock.json
            services/dev-api/package-lock.json
            services/evidence/package-lock.json
            services/financial-core/package-lock.json
            services/fundamentals/package-lock.json
            services/llm/package-lock.json
            services/observability/package-lock.json
            services/snapshot/package-lock.json

      - name: Install db deps (needed by discovery integration harness)
        working-directory: db
        run: npm ci

      - name: Install discovery deps
        working-directory: services/discovery
        run: npm ci

      - name: Install fixture-harness dependencies
        run: |
          npm --prefix services/dev-api ci
          npm --prefix services/evidence ci
          npm --prefix services/financial-core ci
          npm --prefix services/fundamentals ci
          npm --prefix services/llm ci
          npm --prefix services/observability ci
          npm --prefix services/snapshot ci

      - name: Run recorded synthetic discovery tests
        working-directory: services/discovery
        run: npm test

  analyst-grids:
    name: analyst-grids (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/evidence/package-lock.json
            services/analyst-grids/package-lock.json
            services/financial-core/package-lock.json

      - name: Install db deps (needed by analyst-grids integration harness)
        working-directory: db
        run: npm ci

      # Numerical columns import financial-core sources, which resolve their
      # own dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by financial grid columns)
        working-directory: services/financial-core
        run: npm ci

      # reader-wiring imports S3ObjectStore from evidence/, which resolves its
      # own package dependencies from services/evidence/node_modules.
      - name: Install evidence deps (needed by analyst-grids reader wiring)
        working-directory: services/evidence
        run: npm ci

      - name: Install analyst-grids deps
        working-directory: services/analyst-grids
        run: npm ci

      - name: Run analyst-grids tests
        working-directory: services/analyst-grids
        run: npm test

  financial-core:
    name: financial-core (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/financial-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/financial-core/package-lock.json

      - run: npm ci

      - run: npm test

  financial-engine:
    name: financial-engine (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            services/financial-core/package-lock.json
            services/financial-engine/package-lock.json

      # Engine integration tests use the shared db/test Docker harness.
      - name: Install db deps (needed by the engine integration harness)
        working-directory: db
        run: npm ci

      # The engine imports financial-core sources, which resolve their own
      # dependencies (ajv, decimal.js) from services/financial-core/node_modules.
      - name: Install financial-core deps (imported by the engine)
        working-directory: services/financial-core
        run: npm ci

      - name: Install financial-engine deps
        working-directory: services/financial-engine
        run: npm ci

      - name: Run financial-engine tests
        working-directory: services/financial-engine
        run: npm test

  scripts:
    name: scripts (repository contract tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/market/package-lock.json
            services/resolver/package-lock.json
            services/discovery/package-lock.json
            services/financial-core/package-lock.json

      # The contract tests import web's js-yaml/ajv and service sources that
      # resolve their own dependencies from each service's node_modules; the
      # verified-finance gate runs financial-core (ajv, decimal.js).
      - name: Install imported package dependencies
        run: |
          npm --prefix web ci
          npm --prefix services/market ci
          npm --prefix services/resolver ci
          npm --prefix services/discovery ci
          npm --prefix services/financial-core ci

      - name: Run repository contract tests
        run: node --experimental-strip-types --test "scripts/*.test.ts"

